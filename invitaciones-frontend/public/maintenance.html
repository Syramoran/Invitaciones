<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>En mantenimiento | festejá</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #faf9f7;
        font-family: 'Outfit', sans-serif;
        color: #3a3530;
        padding: 2rem 1.25rem;
        text-align: center;
      }

      .card {
        max-width: 480px;
        width: 100%;
        background: #fff;
        border: 1px solid #ebe7e2;
        border-radius: 16px;
        padding: 3rem 2.5rem;
        box-shadow: 0 4px 24px rgba(0,0,0,.06);
      }

      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        background: #fdf3f0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon svg {
        width: 32px;
        height: 32px;
        stroke: #c96a4a;
        fill: none;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .brand {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.1rem;
        letter-spacing: .12em;
        text-transform: lowercase;
        color: #8a7a6a;
        margin-bottom: 1.5rem;
      }

      h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 2rem;
        font-weight: 600;
        line-height: 1.2;
        color: #2d2520;
        margin-bottom: .75rem;
      }

      p {
        font-size: .9375rem;
        font-weight: 300;
        color: #6b5e52;
        line-height: 1.65;
        margin-bottom: 2rem;
      }

      .divider {
        width: 40px;
        height: 1px;
        background: #ddd8d0;
        margin: 0 auto 2rem;
      }

      .contact-title {
        font-size: .75rem;
        font-weight: 600;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: #a0907e;
        margin-bottom: 1rem;
      }

      .contact-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: .625rem;
      }

      .contact-list li {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .5rem;
        font-size: .9rem;
        color: #4a3e35;
      }

      .contact-list a {
        color: #c96a4a;
        text-decoration: none;
        font-weight: 500;
      }
      .contact-list a:hover { text-decoration: underline; }

      .contact-list svg {
        width: 16px;
        height: 16px;
        stroke: #a0907e;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      .retry-btn {
        display: inline-block;
        margin-top: 2rem;
        padding: .65rem 1.75rem;
        background: #3a3530;
        color: #fff;
        border-radius: 8px;
        font-family: 'Outfit', sans-serif;
        font-size: .875rem;
        font-weight: 500;
        letter-spacing: .03em;
        cursor: pointer;
        border: none;
        transition: background .2s;
      }
      .retry-btn:hover { background: #1f1b18; }

      footer {
        margin-top: 2.5rem;
        font-size: .75rem;
        color: #b8ab9f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <!-- Wrench icon -->
        <svg viewBox="0 0 24 24">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>

      <p class="brand">festejá</p>

      <h1>Estamos en mantenimiento</h1>

      <p>
        Nuestro servidor está temporalmente fuera de servicio.<br />
        Estamos trabajando para que todo vuelva a la normalidad lo antes posible.
      </p>

      <div class="divider"></div>

      <p class="contact-title">Contacto</p>

      <ul class="contact-list">
        <li>
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <a href="mailto:festeja.plataforma@gmail.com">festeja.plataforma@gmail.com</a>
        </li>
        <li>
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.6a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 3h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9a16 16 0 0 0 6 6l.27-.26a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 21 17z"/></svg>
          <a href="https://wa.me/5493435083034" target="_blank" rel="noopener">WhatsApp</a>
        </li>
        <li>
          <svg viewBox="0 0 24 24"><path d="M21 2H3v16h5l3 3 3-3h7z"/></svg>
          <a href="https://instagram.com/festeja" target="_blank" rel="noopener">@festeja</a>
        </li>
      </ul>

      <button class="retry-btn" onclick="window.location.reload()">
        Intentar de nuevo
      </button>
    </div>

    <footer>
      &copy; <span id="yr"></span> festejá &mdash; Invitaciones digitales
    </footer>

    <script>
      document.getElementById('yr').textContent = new Date().getFullYear()
    </script>
  </body>
</html>
