name: Health check backend

on:
  schedule:
    # 12:00 UTC = 09:00 America/Argentina/Buenos_Aires (UTC-3 todo el año)
    - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /v1/health
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          curl -sf "$HEALTHCHECK_URL"
